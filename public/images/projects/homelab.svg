    <circle cx="680" cy="470" r="7.5" fill="#ecfeff" fill-opacity="0.9"/>
    <circle cx="715" cy="452" r="7.5" fill="#ecfeff" fill-opacity="0.9"/>
    <circle cx="750" cy="435" r="7.5" fill="#ecfeff" fill-opacity="0.9"/>
    <!-- top face vents -->
    <path d="M520 300 L650 300 M545 340 L700 340 M570 380 L750 380" stroke="#ecfeff" stroke-opacity="0.28" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- seams between units -->
  <path d="M370 450 L600 565 L830 450" stroke="#052e2b" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M370 550 L600 665 L830 550" stroke="#052e2b" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- network traces and nodes -->
