    <rect x="212" y="256" width="7" height="7" opacity="0.55"/>
    <rect x="148" y="298" width="6" height="6" opacity="0.45"/>
    <rect x="168" y="880" width="9" height="9" opacity="0.7"/>
    <rect x="214" y="920" width="6" height="6" opacity="0.45"/>
    <rect x="186" y="960" width="8" height="8" opacity="0.6"/>
    <rect x="1006" y="196" width="10" height="10" opacity="0.8"/>
    <rect x="1042" y="238" width="7" height="7" opacity="0.55"/>
    <rect x="972" y="276" width="6" height="6" opacity="0.45"/>
    <rect x="1030" y="890" width="9" height="9" opacity="0.7"/>
    <rect x="984" y="932" width="6" height="6" opacity="0.45"/>
    <rect x="1024" y="968" width="8" height="8" opacity="0.6"/>
  </g>
  <g fill="#22c55e">
    <rect x="196" y="182" width="7" height="7" opacity="0.6"/>
    <rect x="232" y="300" width="6" height="6" opacity="0.45"/>
    <rect x="196" y="1004" width="7" height="7" opacity="0.55"/>
    <rect x="1044" y="176" width="7" height="7" opacity="0.6"/>
    <rect x="988" y="308" width="6" height="6" opacity="0.45"/>
    <rect x="1038" y="1004" width="7" height="7" opacity="0.55"/>
