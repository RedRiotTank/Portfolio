    <linearGradient id="right3" x1="830" y1="550" x2="600" y2="765" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- roof -->
  <path d="M250 340 L600 120 L950 340" stroke="url(#roof)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M282 334 L600 130 L918 334" stroke="#ecfeff" stroke-opacity="0.22" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- rack: bottom unit -->
  <g>
    <polygon points="370,550 600,665 600,765 370,650" fill="url(#left3)"/>
    <polygon points="600,665 830,550 830,650 600,765" fill="url(#right3)"/>
    <circle cx="680" cy="670" r="7.5" fill="#ecfeff" fill-opacity="0.9"/>
    <circle cx="715" cy="652" r="7.5" fill="#ecfeff" fill-opacity="0.9"/>
    <circle cx="750" cy="635" r="7.5" fill="#ecfeff" fill-opacity="0.9"/>
  </g>

  <!-- rack: middle unit -->
  <g>
    <polygon points="370,450 600,565 600,665 370,550" fill="url(#left2)"/>
    <polygon points="600,565 830,450 830,550 600,665" fill="url(#right2)"/>
    <circle cx="680" cy="570" r="7.5" fill="#ecfeff" fill-opacity="0.9"/>
    <circle cx="715" cy="552" r="7.5" fill="#ecfeff" fill-opacity="0.9"/>
    <circle cx="750" cy="535" r="7.5" fill="#ecfeff" fill-opacity="0.9"/>
  </g>

  <!-- rack: top unit -->
