    <rect x="230" y="940" width="5" height="5" opacity="0.6"/>
    <rect x="1040" y="230" width="5" height="5" opacity="0.7"/>
    <rect x="1000" y="340" width="5" height="5" opacity="0.5"/>
    <rect x="1060" y="940" width="5" height="5" opacity="0.6"/>
  </g>
</svg>
